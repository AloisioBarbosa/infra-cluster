name: Terraform Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Acao do Terraform
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy
      confirmation:
        description: Para destroy, digite destroy-infra-cluster
        required: false
        type: string

concurrency:
  group: terraform-${{ vars.TF_STATE_KEY }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_VERSION: "1.15.8"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_project_name: ${{ vars.TF_VAR_PROJECT_NAME }}
  TF_VAR_region: ${{ vars.TF_VAR_REGION }}
  TF_VAR_environment: ${{ vars.TF_VAR_ENVIRONMENT }}
  TF_VAR_k8s_version: ${{ vars.TF_VAR_K8S_VERSION }}
  TF_VAR_ssm_private_subnets: ${{ vars.TF_VAR_SSM_PRIVATE_SUBNETS }}
  TF_VAR_ssm_pod_subnets: ${{ vars.TF_VAR_SSM_POD_SUBNETS }}
  TF_VAR_nodes_instance_sizes: ${{ vars.TF_VAR_NODES_INSTANCE_SIZES }}
  TF_VAR_auto_scale_options: ${{ vars.TF_VAR_AUTO_SCALE_OPTIONS }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform format
        run: terraform fmt -check -recursive
      - name: Terraform init sem backend
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
      - name: TFLint
        run: |
          tflint --init
          tflint

  security:
    name: Trivy IaC Scan
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Scan Terraform
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: 0
      - name: Publicar resultado SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif

  plan:
    name: Plan
    needs: [validate, security]
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
    runs-on: ubuntu-latest
    environment: plan
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Terraform init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
      - name: Terraform plan
        id: plan
        shell: bash
        run: |
          set +e
          terraform plan -no-color -out=tfplan > plan.txt 2>&1
          exitcode=$?
          echo "exitcode=${exitcode}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comentar plan na PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            const limit = 60000;
            const body = `#### Terraform Plan\n\n\`\`\`text\n${plan.slice(0, limit)}\n\`\`\``;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
      - name: Falhar se o plan falhou
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1

  apply:
    name: Apply
    needs: [validate, security]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Terraform init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
      - name: Gerar plano de aplicacao
        run: terraform plan -out=tfplan
      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

  destroy-plan:
    name: Destroy Plan
    needs: [validate, security]
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: plan
    permissions:
      contents: read
    env:
      DESTROY_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validar confirmacao
        shell: bash
        run: |
          if [[ "$DESTROY_CONFIRMATION" != "destroy-infra-cluster" ]]; then
            echo "Confirmacao invalida. Digite destroy-infra-cluster."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Terraform init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
      - name: Gerar plano de destruicao
        run: |
          terraform plan -destroy -out=destroy.tfplan
          terraform show -no-color destroy.tfplan
      - name: Armazenar plano revisavel
        uses: actions/upload-artifact@v4
        with:
          name: infra-cluster-destroy-plan
          path: destroy.tfplan
          retention-days: 1

  destroy-apply:
    name: Destroy Apply
    needs: destroy-plan
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Terraform init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
      - name: Baixar plano aprovado
        uses: actions/download-artifact@v8
        with:
          name: infra-cluster-destroy-plan
      - name: Aplicar destruicao aprovada
        run: terraform apply -auto-approve destroy.tfplan
